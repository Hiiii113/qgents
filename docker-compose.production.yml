name: qgents-production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qgents
      MYSQL_USER: ${DB_USERNAME:-qgents}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/qgents_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT default_group FROM chat_groups LIMIT 0"']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20

  # 只用于构建镜像，不常驻启动开发容器。
  sandbox-image:
    profiles: [images]
    build: ./sandbox-images/dev-tools
    image: ${SANDBOX_DEV_TOOLS_IMAGE:-qgents/sandbox-dev-tools:0.2.0}

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/qgents?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_AUTH_CODE: ${SMTP_AUTH_CODE:?Set SMTP_AUTH_CODE}
      RSA_PRIVATE_KEY_PATH: file:/run/qgents/rsa/private_key.pem
      GITHUB_APP_PRIVATE_KEY_PATH: /run/qgents/github/private-key.pem
      ATTACHMENT_LOCAL_ROOT: /app/data/attachments
      LOG_FILE: /app/logs/qgents.log
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      MANAGEMENT_SERVER_PORT: "8081"
      SANDBOX_RUNTIME: docker
      SANDBOX_DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_DEV_TOOLS_IMAGE: ${SANDBOX_DEV_TOOLS_IMAGE:-qgents/sandbox-dev-tools:0.2.0}
      SANDBOX_WORKSPACE_LOCAL_ROOT: /var/lib/qgents/workspaces
      SANDBOX_WORKSPACE_DOCKER_HOST_ROOT: ${QGENTS_DATA_ROOT:-/srv/qgents}/workspaces
      SANDBOX_WORKSPACE_METADATA_ROOT: /var/lib/qgents/workspace-metadata
      SANDBOX_INSTANCE_ID: ${SANDBOX_INSTANCE_ID:-production-1}
    volumes:
      - type: bind
        source: ${RSA_PRIVATE_KEY_FILE:-./src/main/resources/rsa/private_key.pem}
        target: /run/qgents/rsa/private_key.pem
        read_only: true
        bind: {create_host_path: false}
      - ${QGENTS_DATA_ROOT:-/srv/qgents}/github-app:/run/qgents/github:ro
      - ${QGENTS_DATA_ROOT:-/srv/qgents}/workspaces:/var/lib/qgents/workspaces
      - ${QGENTS_DATA_ROOT:-/srv/qgents}/workspace-metadata:/var/lib/qgents/workspace-metadata
      - /var/run/docker.sock:/var/run/docker.sock
      - api_data:/app/data
      - api_logs:/app/logs
    group_add: ["${DOCKER_GID:-999}"]
    ports: ["127.0.0.1:${API_HOST_PORT:-8080}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/actuator/health]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ${FRONTEND_DIRECTORY:-../qgents-fronted}
      args:
        VITE_API_BASE_URL: /api
        VITE_RSA_KEY_ID: ${RSA_KEY_ID:-rsa-2026-08}
        VITE_RSA_PUBLIC_KEY: ${FRONTEND_RSA_PUBLIC_KEY:-}
    restart: unless-stopped
    ports: ["${WEB_HOST_PORT:-80}:80"]
    depends_on:
      api: {condition: service_healthy}

  clash:
    image: metacubex/mihomo:latest
    profiles: [proxy]
    restart: unless-stopped
    ports: ["127.0.0.1:7890:7890"]
    volumes: [mihomo_config:/root/.config/mihomo]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web: {condition: service_healthy}

volumes:
  mysql_data:
  redis_data:
  api_data:
  api_logs:
  mihomo_config:

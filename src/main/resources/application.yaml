spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    openai:
      # Qwen3.7-Flash（DashScope OpenAI 兼容）：统一多模态模型，支持图片/文档/PDF 输入，
      # 思考更快、生成时长短，降低非流式超长输出撞服务端响应时限的概率。
      # 回退 DeepSeek：api-key=${DEEPSEEK_API_KEY} / base-url=https://api.deepseek.com/ / model=deepseek-v4-flash
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${AI_MODEL:qwen3.7-flash}
          temperature: 0.2
          # 非流式响应需等待生成结束；限制输出长度以控制响应耗时。
          max-tokens: ${AI_MAX_TOKENS:4096}
  application:
    name: Qgents
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:2000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      # 连接最大存活时间略短于 MySQL wait_timeout，避免服务端断连后复用失效连接
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_AUTH_CODE}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  file:
    name: ${LOG_FILE:logs/qgents.log}

app:
  # 所有 Agent 共用工具循环；普通文本回复结束，不强制工具调用。
  agent:
    max-rounds: ${APP_AGENT_MAX_ROUNDS:30}
    # 同一步中已声明可并行工具的最大在途数；1 表示串行执行。
    max-parallel-tool-calls: ${APP_AGENT_MAX_PARALLEL_TOOL_CALLS:4}
    max-depth: ${APP_AGENT_MAX_DEPTH:3}
    max-subagents: ${APP_AGENT_MAX_SUBAGENTS:8}
    context:
      # 全量注入 Agent 上下文的已批准 Memory 标题与正文总字符上限；超过时禁止批准。
      max-approved-memory-chars: ${APP_AGENT_CONTEXT_MAX_APPROVED_MEMORY_CHARS:12000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  frontend-url-web: ${FRONTEND_URL_WEB:${FRONTEND_URL:http://localhost:5173}}
  frontend-url-mobile: ${FRONTEND_URL_MOBILE:${FRONTEND_URL:http://localhost:5173}}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rsa-private-key: ${RSA_PRIVATE_KEY_PATH:file:./src/main/resources/rsa/private_key.pem}
  rsa-key-id: ${RSA_KEY_ID:rsa-2026-08}
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
  attachment-local-root: ${ATTACHMENT_LOCAL_ROOT:./data/attachments}
  attachment-upload-expiry-seconds: ${ATTACHMENT_UPLOAD_EXPIRY_SECONDS:900}
  # 附件大小上限（字节，默认 50MB）与临时下载地址有效期（秒，默认 900）
  attachment-max-size-bytes: ${APP_ATTACHMENT_MAX_SIZE_BYTES:52428800}
  attachment-download-expiry-seconds: ${APP_ATTACHMENT_DOWNLOAD_EXPIRY_SECONDS:900}
  # Agent 默认预置：建团队事务内补齐团队默认 Agent（通用 Agent 和 Coding Agent）；
  # 启动时为存量 ACTIVE 团队幂等兜底（DefaultAgentProvisioner）
  agent-preseed:
    enabled: ${APP_AGENT_PRESEED_ENABLED:true}

aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    presign-expiry-seconds: ${ALIYUN_OSS_PRESIGN_EXPIRY_SECONDS:900}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

qgents:
  executor:
    agent:
      core-size: ${QGENTS_AGENT_CORE_SIZE:2}
      max-size: ${QGENTS_AGENT_MAX_SIZE:4}
      queue-capacity: ${QGENTS_AGENT_QUEUE_CAPACITY:100}
  push:
    # 移动端 FCM HTTP v1 离线推送默认关闭；服务账号密钥只允许由受控环境变量注入。
    enabled: ${QGENTS_PUSH_ENABLED:false}
    fcm-endpoint: ${QGENTS_PUSH_FCM_ENDPOINT:https://fcm.googleapis.com/v1/projects}
    fcm-project-id: ${QGENTS_PUSH_FCM_PROJECT_ID:}
    fcm-service-account-json-base64: ${QGENTS_PUSH_FCM_SERVICE_ACCOUNT_JSON_BASE64:}
    token-encryption-key: ${QGENTS_PUSH_TOKEN_ENCRYPTION_KEY:}
    max-attempts: ${QGENTS_PUSH_MAX_ATTEMPTS:5}
    poll-interval-ms: ${QGENTS_PUSH_POLL_INTERVAL_MS:5000}

mybatis-plus:
  type-handlers-package: qg.qgent.common.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

github:
  app:
    app-id: ${GITHUB_APP_ID:}
    slug: ${GITHUB_APP_SLUG:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    callback-url: ${GITHUB_APP_CALLBACK_URL:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

# 进程内 Sandbox 模块；用户命令仍在 Docker 容器中执行。
sandbox:
  runtime: ${SANDBOX_RUNTIME:docker}
  image-profile: ${SANDBOX_IMAGE_PROFILE:dev-tools}
  lease-renew-interval: ${SANDBOX_LEASE_RENEW_INTERVAL:10s}
  default-idle-ttl: ${SANDBOX_DEFAULT_IDLE_TTL:30m}
  max-idle-ttl: ${SANDBOX_MAX_IDLE_TTL:2h}
  default-max-lifetime: ${SANDBOX_DEFAULT_MAX_LIFETIME:4h}
  max-lifetime: ${SANDBOX_MAX_LIFETIME:12h}
  default-execution-timeout: ${SANDBOX_DEFAULT_EXECUTION_TIMEOUT:15m}
  max-execution-timeout: ${SANDBOX_MAX_EXECUTION_TIMEOUT:1h}
  cleanup-interval: ${SANDBOX_CLEANUP_INTERVAL:30s}
  execution-threads: ${SANDBOX_EXECUTION_THREADS:4}
  docker-host: ${SANDBOX_DOCKER_HOST:unix:///var/run/docker.sock}
  instance-id: ${SANDBOX_INSTANCE_ID:local}
  workspace-local-root: ${SANDBOX_WORKSPACE_LOCAL_ROOT:/var/lib/qgents/workspaces}
  workspace-docker-host-root: ${SANDBOX_WORKSPACE_DOCKER_HOST_ROOT:/srv/qgents/workspaces}
  workspace-metadata-root: ${SANDBOX_WORKSPACE_METADATA_ROOT:/var/lib/qgents/workspace-metadata}
  images:
    dev-tools: ${SANDBOX_DEV_TOOLS_IMAGE:qgents/sandbox-dev-tools:0.2.0}
  memory-bytes: ${SANDBOX_MEMORY_BYTES:4294967296}
  nano-cpus: ${SANDBOX_NANO_CPUS:2000000000}
  pids-limit: ${SANDBOX_PIDS_LIMIT:256}
  # Maven/Gradle/npm 首次运行需要从远端解析依赖；可通过 SANDBOX_NETWORK_POLICY=none 显式禁网。
  network-policy: ${SANDBOX_NETWORK_POLICY:outbound}
  # stdout 和 stderr 各自允许保留的最大字节数
  max-output-bytes: ${SANDBOX_MAX_OUTPUT_BYTES:1048576}
  # 单个 Sandbox 的 Maven / Maven Wrapper 临时缓存容量上限（容器内可写 tmpfs，Sandbox 销毁后清理）
  maven-cache-size: ${SANDBOX_MAVEN_CACHE_SIZE:2g}
  # 单个 Sandbox 的 Gradle 临时缓存容量上限（容器内可写 tmpfs，Sandbox 销毁后清理）
  gradle-cache-size: ${SANDBOX_GRADLE_CACHE_SIZE:3g}
  # 单个 Sandbox 的 npm 临时缓存容量上限（容器内可写 tmpfs，Sandbox 销毁后清理）
  npm-cache-size: ${SANDBOX_NPM_CACHE_SIZE:1g}
  developer-home-size: ${SANDBOX_DEVELOPER_HOME_SIZE:8g}

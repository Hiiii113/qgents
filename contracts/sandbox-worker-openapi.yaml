openapi: 3.1.0
info:
  title: Qgents Workspace 与 Sandbox Worker 内部接口
  version: 2.0.0
  description: Workspace 与临时 Sandbox 的内部协议。文件工具按窗口或匹配结果返回，command.run 执行 argv 数组；正常命令的非零
    exitCode 仍是完成结果。完整命令输出可按字节游标读取。environment 只用于本次执行，不持久化。
paths:
  /internal/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Worker 存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /internal/v1/workspaces/{workspaceId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    put:
      operationId: provisionWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
      responses:
        '200':
          description: 已幂等准备 Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '409':
          description: 同一编号的规格冲突
    get:
      operationId: getWorkspace
      responses:
        '200':
          description: Workspace 与真实 HEAD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    delete:
      operationId: deleteWorkspace
      responses:
        '204':
          description: 已删除或原本不存在
        '409':
          description: Workspace 仍被 Sandbox 使用
  /internal/v1/sandboxes:
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Sandbox 已创建（相同 sandboxId 与相同关联/Workspace 规格的重复请求幂等返回已有 Sandbox）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '409':
          description: 相同 sandboxId 但关联/Workspace 规格不一致（SANDBOX_ID_CONFLICT）
        '422':
          description: 镜像不在白名单或 workspaceStorageKey 非法
  /internal/v1/sandboxes/{sandboxId}:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '404':
          description: Sandbox 不存在
    delete:
      operationId: destroySandbox
      responses:
        '204':
          description: Sandbox 已销毁，Workspace 保留
  /internal/v1/sandboxes/{sandboxId}/lease/renew:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: renewSandboxLease
      parameters:
      - name: ttlSeconds
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 租约已续期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
  /internal/v1/sandboxes/{sandboxId}/tool-executions:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecutionRequest'
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
  /internal/v1/tool-executions/{executionId}:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getToolExecution
      responses:
        '200':
          description: 执行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
  /internal/v1/tool-executions/{executionId}/logs:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getToolExecutionLogs
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
      responses:
        '200':
          description: 有序增量日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLogs'
  /internal/v1/tool-executions/{executionId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: cancelToolExecution
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
  /internal/v1/tool-executions/{executionId}/output:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getCommandOutput
      parameters:
      - name: stdoutOffset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: stderrOffset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: maxBytes
        in: query
        schema:
          type: integer
          minimum: 4
          default: 16000
          maximum: 64000
      responses:
        '200':
          description: 命令已写入的有界输出窗口；独立字节游标避免丢失运行中的半行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOutput'
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    WorkspaceProvisionRequest:
      type: object
      required:
      - projectId
      properties:
        projectId:
          type: string
          format: uuid
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        storageKey:
          type: string
        status:
          type: string
          enum:
          - READY
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiffHunk:
      type: object
      description: 一个 hunk 的头部与逐行内容（行级红绿 diff 渲染用）
      properties:
        header:
          type: object
          properties:
            oldStart:
              type: integer
              description: 旧文件起始行号（1 起）
            newStart:
              type: integer
              description: 新文件起始行号（1 起）
            oldLines:
              type: integer
              description: 旧文件覆盖行数
            newLines:
              type: integer
              description: 新文件覆盖行数
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunkLine'
    DiffHunkLine:
      type: object
      properties:
        type:
          type: string
          enum:
          - CONTEXT
          - ADD
          - DELETE
          description: 行类型：上下文/新增/删除
        oldLineNo:
          type:
          - integer
          - 'null'
          description: 旧文件行号；ADD 行为 null
        newLineNo:
          type:
          - integer
          - 'null'
          description: 新文件行号；DELETE 行为 null
        content:
          type: string
          description: 行内容（不含 +/- 前缀符号）
    ResourceLimits:
      type: object
      properties:
        idleTtlSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        maxLifetimeSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        executionTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
    CreateSandboxRequest:
      type: object
      required:
      - sandboxId
      - agentRunId
      - workspaceStorageKey
      - imageProfile
      properties:
        sandboxId:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        workspaceStorageKey:
          type: string
          minLength: 47
          maxLength: 47
          pattern: ^workspaces/[0-9a-fA-F-]{36}$
        imageProfile:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9-]*$
        limits:
          $ref: '#/components/schemas/ResourceLimits'
    Sandbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        workspaceStorageKey:
          type: string
        imageProfile:
          type: string
        status:
          type: string
        runtimeKind:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxExpiresAt:
          type: string
          format: date-time
    ToolExecutionRequest:
      type: object
      required:
      - executionId
      - tool
      - arguments
      properties:
        executionId:
          type: string
          format: uuid
        tool:
          type: string
          enum:
          - file.read
          - file.glob
          - file.search
          - file.write
          - file.edit
          - file.patch
          - command.run
        arguments:
          oneOf:
          - $ref: '#/components/schemas/FileReadArguments'
          - $ref: '#/components/schemas/FileGlobArguments'
          - $ref: '#/components/schemas/FileSearchArguments'
          - $ref: '#/components/schemas/FileWriteArguments'
          - $ref: '#/components/schemas/FileEditArguments'
          - $ref: '#/components/schemas/FilePatchArguments'
          - $ref: '#/components/schemas/CommandRunArguments'
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        environment:
          type: object
          additionalProperties:
            type: string
          description: 临时进程环境，不持久化；由可信 API 调用方提供。
    FilePatchArguments:
      type: object
      required:
      - path
      - expectedHash
      - patch
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Repository 内相对路径，禁止绝对路径与 .. 越界
        expectedHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          description: 目标文件当前内容的 SHA-256，不一致时拒绝应用
        patch:
          type: string
          minLength: 1
          maxLength: 1048576
          description: 统一 Diff 文本，按声明行号精确应用
    FilePatchResult:
      type: object
      properties:
        path:
          type: string
        sha256:
          type: string
        bytes:
          type: integer
        changed:
          type: boolean
    ToolExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerWorkerId:
          type: string
        sandboxId:
          type: string
          format: uuid
        tool:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - CANCELLED
          - INTERRUPTED
          description: command.run 正常取得退出码后为 SUCCEEDED，包括非零退出码；超时、取消和基础设施失败另行记录。
        exitCode:
          type:
          - integer
          - 'null'
        result:
          type: object
        failureCode:
          type:
          - string
          - 'null'
          maxLength: 64
          description: 稳定失败码；正常结束为 null
        failureReason:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    ExecutionLogEntry:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
        stream:
          type: string
          enum:
          - SYSTEM
          - STDOUT
          - STDERR
        content:
          type: string
        timestamp:
          type: string
          format: date-time
    ExecutionLogs:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionLogEntry'
        nextCursor:
          type: integer
          format: int64
    FileReadArguments:
      type: object
      additionalProperties: false
      required:
      - path
      properties:
        path: &id001
          type: string
          minLength: 1
          maxLength: 1024
        startLine:
          type: integer
          minimum: 1
          default: 1
        lineCount:
          type: integer
          minimum: 1
          default: 200
          maximum: 1000
    FileGlobArguments:
      type: object
      additionalProperties: false
      required: []
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          default: .
        glob:
          type: string
          default: '**'
          maxLength: 512
        limit:
          type: integer
          minimum: 1
          default: 200
          maximum: 1000
    FileSearchArguments:
      type: object
      additionalProperties: false
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 512
        path:
          type: string
          minLength: 1
          maxLength: 1024
          default: .
        glob:
          type: string
          default: '**'
          maxLength: 512
        limit:
          type: integer
          minimum: 1
          default: 100
          maximum: 1000
    FileWriteArguments:
      type: object
      additionalProperties: false
      required:
      - path
      - expectedHash
      - mode
      - content
      properties:
        path: *id001
        expectedHash: &id002
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        mode:
          type: string
          enum:
          - create
          - replace
        content: &id003
          type: string
    FileEditArguments:
      type: object
      additionalProperties: false
      required:
      - path
      - expectedHash
      - oldText
      - newText
      properties:
        path: *id001
        expectedHash: *id002
        oldText:
          type: string
          minLength: 1
        newText: *id003
        replaceAll:
          type: boolean
          default: false
    CommandRunArguments:
      type: object
      additionalProperties: false
      required:
      - command
      properties:
        command:
          type: array
          minItems: 1
          items:
            type: string
        directory:
          type: string
          default: .
    FileReadResult:
      type: object
      additionalProperties: false
      required:
      - path
      - sha256
      - startLine
      - totalLines
      - lines
      - truncated
      - nextLine
      - endsWithNewline
      - newlineStyle
      properties:
        path: *id003
        sha256: *id002
        startLine:
          type: integer
          minimum: 1
          default: 1
        totalLines:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - number
            - text
            - truncated
            properties:
              number:
                type: integer
                minimum: 1
                default: 1
              text: *id003
              truncated: &id004
                type: boolean
        truncated: *id004
        nextLine:
          type: integer
          minimum: 1
          default: 1
        endsWithNewline: *id004
        newlineStyle:
          type: string
          enum:
          - LF
          - CRLF
          - NONE
    FileGlobResult:
      type: object
      additionalProperties: false
      required:
      - files
      - truncated
      properties:
        files:
          type: array
          items: *id003
        truncated: *id004
    FileSearchResult:
      type: object
      additionalProperties: false
      required:
      - matches
      - truncated
      properties:
        matches:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - lineNumber
            - text
            - truncated
            properties:
              path: *id003
              lineNumber:
                type: integer
                minimum: 1
                default: 1
              text: *id003
              truncated: *id004
        truncated: *id004
    FileWriteResult:
      type: object
      additionalProperties: false
      required:
      - path
      - sha256
      - bytes
      - changed
      properties:
        path: *id003
        sha256: *id002
        bytes:
          type: integer
          minimum: 0
        changed: *id004
    FileEditResult:
      type: object
      additionalProperties: false
      required:
      - path
      - sha256
      - changed
      - oldText
      - newText
      properties:
        path: *id003
        sha256: *id002
        changed: *id004
        oldText: *id003
        newText: *id003
    CommandStreamTail:
      type: object
      additionalProperties: false
      required:
      - text
      - truncated
      properties:
        text: *id003
        truncated: *id004
    CommandStreamWindow:
      type: object
      additionalProperties: false
      required:
      - text
      - nextOffset
      - truncated
      properties:
        text: *id003
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        truncated: *id004
    CommandResult:
      type: object
      additionalProperties: false
      required:
      - stdout
      - stderr
      - outputAvailable
      properties:
        stdout:
          $ref: '#/components/schemas/CommandStreamTail'
        stderr:
          $ref: '#/components/schemas/CommandStreamTail'
        outputAvailable: *id004
    CommandOutput:
      type: object
      additionalProperties: false
      required:
      - stdout
      - stderr
      properties:
        stdout:
          $ref: '#/components/schemas/CommandStreamWindow'
        stderr:
          $ref: '#/components/schemas/CommandStreamWindow'
  securitySchemes:
    InternalServiceToken:
      type: http
      scheme: bearer
security:
- InternalServiceToken: []

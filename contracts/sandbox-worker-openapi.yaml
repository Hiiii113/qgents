openapi: 3.1.0
info:
  title: Qgents Workspace 与 Sandbox Worker 内部接口
  version: 1.0.0
  description: 系统管理空工作区、沙箱和工具执行。仓库由 Agent 自主 clone；command.run 接收 command 参数数组与工作区相对
    directory。environment 仅用于本次执行，不持久化。内部接口需服务 Bearer Token。
paths:
  /internal/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Worker 存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /internal/v1/workspaces/{workspaceId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    put:
      operationId: provisionWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceProvisionRequest'
      responses:
        '200':
          description: 已幂等准备 Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '409':
          description: 同一编号的规格冲突
    get:
      operationId: getWorkspace
      responses:
        '200':
          description: Workspace 与真实 HEAD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    delete:
      operationId: deleteWorkspace
      responses:
        '204':
          description: 已删除或原本不存在
        '409':
          description: Workspace 仍被 Sandbox 使用
  /internal/v1/sandboxes:
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Sandbox 已创建（相同 sandboxId 与相同关联/Workspace 规格的重复请求幂等返回已有 Sandbox）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '409':
          description: 相同 sandboxId 但关联/Workspace 规格不一致（SANDBOX_ID_CONFLICT）
        '422':
          description: 镜像不在白名单或 workspaceStorageKey 非法
  /internal/v1/sandboxes/{sandboxId}:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    get:
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '404':
          description: Sandbox 不存在
    delete:
      operationId: destroySandbox
      responses:
        '204':
          description: Sandbox 已销毁，Workspace 保留
  /internal/v1/sandboxes/{sandboxId}/lease/renew:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: renewSandboxLease
      parameters:
      - name: ttlSeconds
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 租约已续期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
  /internal/v1/sandboxes/{sandboxId}/tool-executions:
    parameters:
    - $ref: '#/components/parameters/SandboxId'
    post:
      operationId: executeTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecutionRequest'
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
  /internal/v1/tool-executions/{executionId}:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getToolExecution
      responses:
        '200':
          description: 执行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
  /internal/v1/tool-executions/{executionId}/logs:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getToolExecutionLogs
      parameters:
      - name: after
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
      responses:
        '200':
          description: 有序增量日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLogs'
  /internal/v1/tool-executions/{executionId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: cancelToolExecution
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecution'
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    WorkspaceProvisionRequest:
      type: object
      required:
      - projectId
      properties:
        projectId:
          type: string
          format: uuid
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        storageKey:
          type: string
        status:
          type: string
          enum:
          - READY
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiffHunk:
      type: object
      description: 一个 hunk 的头部与逐行内容（行级红绿 diff 渲染用）
      properties:
        header:
          type: object
          properties:
            oldStart:
              type: integer
              description: 旧文件起始行号（1 起）
            newStart:
              type: integer
              description: 新文件起始行号（1 起）
            oldLines:
              type: integer
              description: 旧文件覆盖行数
            newLines:
              type: integer
              description: 新文件覆盖行数
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunkLine'
    DiffHunkLine:
      type: object
      properties:
        type:
          type: string
          enum:
          - CONTEXT
          - ADD
          - DELETE
          description: 行类型：上下文/新增/删除
        oldLineNo:
          type:
          - integer
          - 'null'
          description: 旧文件行号；ADD 行为 null
        newLineNo:
          type:
          - integer
          - 'null'
          description: 新文件行号；DELETE 行为 null
        content:
          type: string
          description: 行内容（不含 +/- 前缀符号）
    ResourceLimits:
      type: object
      properties:
        idleTtlSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        maxLifetimeSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        executionTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
    CreateSandboxRequest:
      type: object
      required:
      - sandboxId
      - agentRunId
      - workspaceStorageKey
      - imageProfile
      properties:
        sandboxId:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        workspaceStorageKey:
          type: string
          minLength: 47
          maxLength: 47
          pattern: ^workspaces/[0-9a-fA-F-]{36}$
        imageProfile:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9-]*$
        limits:
          $ref: '#/components/schemas/ResourceLimits'
    Sandbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentRunId:
          type: string
          format: uuid
        workspaceStorageKey:
          type: string
        imageProfile:
          type: string
        status:
          type: string
        runtimeKind:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        maxExpiresAt:
          type: string
          format: date-time
    ToolExecutionRequest:
      type: object
      required:
      - executionId
      - tool
      - arguments
      properties:
        executionId:
          type: string
          format: uuid
        tool:
          type: string
          enum:
          - process.exec
          - file.read
          - file.list
          - file.search
          - file.write
          - file.patch
          - directory.create
          - command.run
        arguments:
          type: object
          maxProperties: 64
          description: 各工具的结构化参数（如 ProcessExecArguments、FilePatchArguments）
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        environment:
          type: object
          additionalProperties:
            type: string
          description: 临时进程环境，不持久化；由可信 API 调用方提供。
    ProcessExecArguments:
      type: object
      required:
      - command
      properties:
        command:
          type: array
          minItems: 1
          maxItems: 64
          description: 参数向量；允许常规构建工具和 sh ./gradlew 或 sh ./mvnw Wrapper，不允许 sh -c、bash
            -c 或任意脚本路径
          items:
            type: string
            minLength: 1
            maxLength: 4096
    FilePatchArguments:
      type: object
      required:
      - path
      - expectedHash
      - patch
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Repository 内相对路径，禁止绝对路径与 .. 越界
        expectedHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          description: 目标文件当前内容的 SHA-256，不一致时拒绝应用
        patch:
          type: string
          minLength: 1
          maxLength: 1048576
          description: 统一 Diff 文本，按声明行号精确应用
    FilePatchResult:
      type: object
      properties:
        path:
          type: string
        sha256:
          type: string
        bytes:
          type: integer
        changed:
          type: boolean
    DirectoryCreateArguments:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Repository 内相对目录路径，禁止绝对路径与 .. 越界
    DirectoryCreateResult:
      type: object
      required:
      - path
      - created
      properties:
        path:
          type: string
        created:
          type: boolean
          description: 目录是否由本次调用实际创建
    ToolExecution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerWorkerId:
          type: string
        sandboxId:
          type: string
          format: uuid
        tool:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - CANCELLED
          - INTERRUPTED
        exitCode:
          type:
          - integer
          - 'null'
        result:
          type: object
        failureCode:
          type:
          - string
          - 'null'
          maxLength: 64
          description: 稳定失败码；正常结束为 null
        failureReason:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    ExecutionLogEntry:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
        stream:
          type: string
          enum:
          - SYSTEM
          - STDOUT
          - STDERR
        content:
          type: string
        timestamp:
          type: string
          format: date-time
    ExecutionLogs:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionLogEntry'
        nextCursor:
          type: integer
          format: int64
  securitySchemes:
    InternalServiceToken:
      type: http
      scheme: bearer
security:
- InternalServiceToken: []
